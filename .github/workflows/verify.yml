name: Verifiering

# Kör automatiskt vid varje push och pull request mot main/master.
# Inga manuella knapptryckningar behövs — sviten blockerar en dålig ändring.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installera beroenden
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsgo --noEmit

      - name: Enhetstester
        run: bunx vitest run
